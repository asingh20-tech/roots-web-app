# Production-like local run:  docker compose up --build  ->  http://localhost:8000
# Uses the same Dockerfile as the real deployment. Reads secrets from .env.
services:
  db:
    image: postgres:16
    env_file: .env            # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      FRONTEND_URL: http://localhost:8000
      DJANGO_DEBUG: "True"    # local only: no HTTPS redirect on http://localhost
    ports:
      - "8000:8000"
    volumes:
      - media:/data           # uploaded photos/documents survive restarts
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
